# OralPath — Stage 1 Detection Training Config
# Binary classification: OSCC vs Normal

experiment_name: "stage1_detection_v1"
seed: 42

# Dataset
dataset:
  manifest: "model/data/manifests/kaggle_oscc.json"
  target_size: [224, 224]
  batch_size: 32
  num_workers: 4
  stain_norm: "macenko"  # options: none, macenko

# Model
model:
  backbone: "uni"  # options: uni, ctranspath, efficientnetb3
  freeze_backbone: true
  head_hidden_dim: 512
  dropout: 0.3

# Training
training:
  epochs: 50
  optimizer: "adamw"
  lr: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: "cosine"
  warmup_epochs: 5
  label_smoothing: 0.0
  early_stopping_patience: 10

# Augmentation
augmentation:
  horizontal_flip: true
  vertical_flip: false
  rotation_degrees: 15
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.1
    hue: 0.05
  elastic_distortion: false

# Evaluation
evaluation:
  metrics: ["accuracy", "precision", "recall", "f1", "auc_roc", "confusion_matrix"]
  target_sensitivity: 0.95
  target_specificity: 0.90

# Export
export:
  onnx: true
  tflite: true
  output_dir: "model/export/stage1/"

# Logging
logging:
  log_dir: "model/training/stage1_detection/logs/"
  checkpoint_dir: "model/training/stage1_detection/checkpoints/"
  save_best_only: true
